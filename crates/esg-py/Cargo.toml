[package]
name = "esg-py"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Python bindings for e-shop-graph: zero-copy e-commerce product knowledge graph"

[lib]
name = "esg"
# cdylib: the .so/.pyd Python imports. rlib so other Rust crates could still
# depend on it if ever needed.
crate-type = ["cdylib", "rlib"]

[dependencies]
esg-core = { workspace = true }
esg-extract = { workspace = true }
# abi3-py38: one wheel works on CPython 3.8+ (stable ABI) — no per-version
# build matrix. extension-module: don't link libpython (manylinux needs this).
pyo3 = { version = "0.23", features = ["abi3-py38", "extension-module"] }
