[workspace]
members = ["crates/esg-core", "crates/esg-extract", "crates/esg-cli", "crates/esg-py"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# Internal deps declared once so the version constraint tracks the workspace.
[workspace.dependencies]
esg-core = { path = "crates/esg-core", version = "0.3.0" }
esg-extract = { path = "crates/esg-extract", version = "0.3.0" }

# Shared third-party. rkyv drives the zero-copy graph.bin; scraper/serde_json
# the JSON-LD extraction; rayon the per-page parallelism.
rkyv = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
scraper = "0.20"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
memmap2 = "0.9"
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 1
